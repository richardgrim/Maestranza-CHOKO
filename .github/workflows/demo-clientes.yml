name: Demostración web de clientes
on:
  push:
    branches: [demo/i1-clientes]
  pull_request:
    branches: [feat/i1-acceso-web, main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  demostracion:
    timeout-minutes: 12
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: choko_test
          POSTGRES_USER: choko_test
          POSTGRES_PASSWORD: solo-pruebas
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      CHOKO_WEB_USER: operador-pruebas
      CHOKO_WEB_PASSWORD: clave-solo-para-ci
      CHOKO_DB_URL: jdbc:postgresql://localhost:5432/choko_test
      CHOKO_DB_USER: choko_test
      CHOKO_DB_PASSWORD: solo-pruebas
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Crear esquema de prueba
        run: PGPASSWORD="$CHOKO_DB_PASSWORD" psql -h localhost -U choko_test -d choko_test -v ON_ERROR_STOP=1 -1 -f db/001_clientes.sql -f db/002_ordenes.sql
      - run: mvn --batch-mode verify
      - name: Preparar navegador
        run: |
          python3 -m venv "$RUNNER_TEMP/navegador"
          "$RUNNER_TEMP/navegador/bin/pip" install playwright==1.56.0
      - name: Probar el flujo y obtener capturas
        run: |
          java -jar target/maestranza-choko-0.1.0-SNAPSHOT.jar --server.address=127.0.0.1 > "$RUNNER_TEMP/choko.log" 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true' EXIT
          curl -fsS --retry 45 --retry-delay 1 --retry-all-errors http://127.0.0.1:8080/login -o /dev/null
          "$RUNNER_TEMP/navegador/bin/python" pruebas/demo_clientes.py
      - name: Identificar la versión demostrada
        run: |
          printf 'Repositorio: %s\nCommit: %s\nEjecución: %s/%s/actions/runs/%s\n' \
            "$GITHUB_REPOSITORY" "$GITHUB_SHA" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" > evidencias/version.txt
      - name: Guardar evidencias
        uses: actions/upload-artifact@v4
        with:
          name: evidencias-I1-clientes
          path: evidencias/
          if-no-files-found: error
