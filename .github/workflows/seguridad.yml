name: Controles DevSecOps
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  codigo:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Revisar historial con Gitleaks
        run: |
          docker run --rm -v "$PWD:/src:ro" -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/src ghcr.io/gitleaks/gitleaks:v8.30.1 git /src --log-opts="HEAD" --redact
      - name: Analizar código Java con Semgrep
        run: |
          docker run --rm -v "$PWD:/src:ro" -w /src semgrep/semgrep:1.187.0 semgrep scan --config p/java --metrics=off --strict --json src/main/java > semgrep.json
          jq -er '"Semgrep: \(.results | length) hallazgos; \(.paths.scanned | length) archivos analizados."' semgrep.json | tee -a "$GITHUB_STEP_SUMMARY"
          jq -e '(.paths.scanned | length) > 0 and (.errors | length) == 0 and ([.results[] | select(.extra.severity == "ERROR")] | length) == 0' semgrep.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: I4-semgrep
          path: semgrep.json
  dependencias:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Revisar dependencias con OWASP Dependency-Check
        run: |
          set +e
          mvn -B -ntp org.owasp:dependency-check-maven:13.0.0:check \
            '-DnvdDatafeedUrl=https://nvd.nist.gov/feeds/json/cve/2.0/nvdcve-2.0-{0}.json.gz' \
            -Dformats=HTML,JSON -DossindexAnalyzerEnabled=false > "$RUNNER_TEMP/dependency-check.log" 2>&1
          resultado=$?
          set -e
          grep -E '(^\[ERROR\]|^\[WARNING\]|BUILD (SUCCESS|FAILURE))' "$RUNNER_TEMP/dependency-check.log" | tail -30 || true
          if [ -f target/dependency-check-report.json ]; then
            jq -c '.scanInfo.analysisExceptions // [] | map(.message // .exception // .) | .[:5]' target/dependency-check-report.json | cut -c1-2600
          fi
          if [ "$resultado" -ne 0 ]; then exit "$resultado"; fi
          jq -er '"Dependency-Check: \(.dependencies | length) dependencias; \([.dependencies[].vulnerabilities[]?] | length) coincidencias."' target/dependency-check-report.json | tee -a "$GITHUB_STEP_SUMMARY"
          jq -e '(.dependencies | length) > 0' target/dependency-check-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: I4-dependencias
          path: target/dependency-check-report.*
  imagen:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - name: Recuperar el informe de referencia del I4
        if: github.event_name == 'pull_request' && github.event.pull_request.number == 6
        uses: actions/download-artifact@v4
        with:
          name: I4-imagen
          run-id: 45731560548
          github-token: ${{ github.token }}
          path: referencia
      - name: Clasificar el informe original
        if: github.event_name == 'pull_request' && github.event.pull_request.number == 6
        run: python3 pruebas/resumen_trivy.py referencia/trivy.json revision/referencia
      - name: Construir la imagen del laboratorio
        run: docker build -t choko:i4 .
      - name: Analizar la imagen con Trivy
        run: |
          docker save -o "$RUNNER_TEMP/choko.tar" choko:i4
          docker run --rm -v "$RUNNER_TEMP/choko.tar:/scan/image.tar:ro" aquasec/trivy:0.76.2 image --scanners vuln --input /scan/image.tar --format json > trivy.json
          jq -er '[.Results[].Vulnerabilities[]?] | group_by(.Severity) | map("\(.[0].Severity): \(length)") | "Trivy: " + join(", ")' trivy.json | tee -a "$GITHUB_STEP_SUMMARY"
          jq -e '(.Results | length) > 0' trivy.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: I4-imagen
          path: trivy.json

      - name: Clasificar el informe de la imagen construida
        run: python3 pruebas/resumen_trivy.py trivy.json revision/actual
      - uses: actions/upload-artifact@v4
        with:
          name: I4-revision-imagen
          path: revision/
          if-no-files-found: error
