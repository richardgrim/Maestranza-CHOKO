services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: choko
      POSTGRES_USER: choko
      POSTGRES_PASSWORD: ${CHOKO_DB_PASSWORD:?Defina CHOKO_DB_PASSWORD}
    volumes:
      - datos:/var/lib/postgresql/data
      - ./db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U choko -d choko"]
      interval: 3s
      timeout: 3s
      retries: 30
  web:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      CHOKO_DB_URL: jdbc:postgresql://db:5432/choko
      CHOKO_DB_USER: choko
      CHOKO_DB_PASSWORD: ${CHOKO_DB_PASSWORD:?Defina CHOKO_DB_PASSWORD}
      CHOKO_WEB_USER: ${CHOKO_WEB_USER:?Defina CHOKO_WEB_USER}
      CHOKO_WEB_PASSWORD: ${CHOKO_WEB_PASSWORD:?Defina CHOKO_WEB_PASSWORD}
    ports:
      - "127.0.0.1:8080:8080"
volumes:
  datos:
