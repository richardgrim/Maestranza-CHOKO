spring.datasource.url=${CHOKO_DB_URL}
spring.datasource.username=${CHOKO_DB_USER}
spring.datasource.password=${CHOKO_DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.security.user.name=${CHOKO_WEB_USER}
spring.security.user.password=${CHOKO_WEB_PASSWORD}
spring.security.user.roles=OPERADOR
