<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Órdenes de trabajo · Maestranza CHOKO</title>
  <link rel="stylesheet" th:href="@{/choko.css}">
</head>
<body>
  <header><span>Maestranza <strong>CHOKO</strong></span><form method="post" th:action="@{/logout}"><button class="secundario">Cerrar sesión</button></form></header>
  <main>
    <a th:href="@{/clientes}">Volver a clientes</a>
    <h1>Órdenes de trabajo</h1>
    <div class="fila"><h2 th:text="${cliente.nombre}"></h2>
      <a th:if="${puedeRegistrar}" class="accion" th:href="@{/clientes/{id}/ordenes/nueva(id=${cliente.id})}">Registrar orden</a></div>
    <p role="status" th:if="${aviso}" th:text="${aviso}"></p>
    <p th:if="${ordenes.empty}">Este cliente aún no tiene órdenes.</p>
    <article th:each="orden : ${ordenes}">
      <h3 th:text="|Orden #${orden.id} · ${orden.componente}|"></h3>
      <p style="white-space:pre-line;overflow-wrap:anywhere" th:text="${orden.servicios}"></p>
      <p>Recepción <time th:text="${orden.recepcion}"></time> · Entrega estimada <time th:text="${orden.entregaEstimada}"></time></p>
    </article>
  </main>
</body>
</html>
